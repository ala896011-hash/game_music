<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музичний Баттл — Вгадай жанр</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --panel-bg: rgba(255, 255, 255, 0.07);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-color: #00ffcc;
            --accent-pink: #ff007f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .lobby-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lobby-subtitle {
            text-align: center;
            color: #b0b0b0;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .players-inputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .input-group input {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            color: #0f0c29;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            font-size: 0.85rem;
        }

        .player-score-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 42%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-score-card.active-turn {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .round-counter {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--accent-pink);
            text-align: center;
        }

        .turn-announcement {
            text-align: center;
            font-size: 1.15rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .audio-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .play-audio-btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .play-audio-btn:active { opacity: 0.8; }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-card:active {
            background: rgba(0, 255, 204, 0.1);
        }

        .choice-letter {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 35px;
            height: 35px;
            background: var(--accent-color);
            color: #0f0c29;
            font-weight: bold;
            border-radius: 50%;
            font-size: 1rem;
        }

        .choice-text {
            font-size: 1rem;
            font-weight: 600;
        }

        .choice-card.correct {
            background: rgba(0, 255, 128, 0.25);
            border-color: #00ff80;
        }

        .choice-card.wrong {
            background: rgba(255, 0, 64, 0.25);
            border-color: #ff0040;
        }

        .track-reveal {
            display: none;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .winner-screen { text-align: center; padding: 10px; }
        .winner-title { font-size: 2rem; margin-bottom: 10px; color: var(--accent-color); }
        .winner-name { font-size: 1.5rem; font-weight: bold; color: var(--accent-pink); margin-bottom: 15px; }

        /* Планшети та ПК (широкі екрани) */
        @media (min-width: 768px) {
            .container { padding: 30px; }
            .lobby-title { font-size: 2.2rem; }
            .players-inputs { flex-direction: row; }
            .game-header { font-size: 1rem; }
            .choices-container { display: grid; grid-template-columns: repeat(3, 1fr); }
            .choice-card { flex-direction: column; text-align: center; padding: 20px 15px; }
            .choice-letter { margin-bottom: 10px; }
            .play-audio-btn { width: auto; padding: 12px 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ЛОББІ -->
        <div id="lobby-screen" class="screen active">
            <h1 class="lobby-title">🎵 Музичний Баттл</h1>
            <p class="lobby-subtitle">Введіть нікнейми двох гравців!</p>
            
            <div class="players-inputs">
                <div class="input-group">
                    <label for="player1-input">ГРАВЕЦЬ 1</label>
                    <input type="text" id="player1-input" placeholder="Ім'я гравця 1...">
                </div>
                <div class="input-group">
                    <label for="player2-input">ГРАВЕЦЬ 2</label>
                    <input type="text" id="player2-input" placeholder="Ім'я гравця 2...">
                </div>
            </div>

            <button class="btn" id="start-btn">Розпочати гру</button>
        </div>

        <!-- ІГРОВИЙ ЕКРАН -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="player-score-card" id="p1-card">
                    <span id="p1-name-display">Гр. 1</span>: <strong id="p1-score">0</strong>
                </div>
                <div class="round-counter">П. <span id="current-round">1</span> / 8</div>
                <div class="player-score-card" id="p2-card">
                    <span id="p2-name-display">Гр. 2</span>: <strong id="p2-score">0</strong>
                </div>
            </div>

            <div class="turn-announcement" id="turn-announcement">Хід гравця</div>

            <div class="audio-section">
                <p>🎧 Прослухайте уривок (6 сек.) та вгадайте <strong>жанр</strong>:</p>
                <button class="play-audio-btn" id="play-btn">▶ Відтворити уривок</button>
            </div>

            <div class="track-reveal" id="track-reveal">
                <div id="reveal-title" style="font-weight: bold; color: #00ffcc;"></div>
            </div>

            <div class="choices-container" id="choices-container"></div>
        </div>

        <!-- ЕКРАН ПЕРЕМОГИ -->
        <div id="end-screen" class="screen">
            <div class="winner-screen">
                <h2 class="winner-title">🏆 Гра закінчена!</h2>
                <div class="winner-name" id="winner-announcement">Переможець</div>
                <p id="final-scores-text" style="margin-bottom: 25px; color: #b0b0b0;"></p>
                <button class="btn" onclick="location.reload()">Грати знову</button>
            </div>
        </div>
    </div>

    <script>
        const tracksData = [
            { title: "Dua Lipa – Break My Heart", genre: "Поп / Диско", fileUrl: "audio/track1.mp3" },
            { title: "Modern Talking – Cheri Cheri Lady", genre: "Євродиско / Ретро", fileUrl: "audio/track2.mp3" },
            { title: "Don Omar – Danza Kuduro", genre: "Латина / Реггетон", fileUrl: "audio/track3.mp3" },
            { title: "Riton x Nightcrawlers – Friday", genre: "Танцювальна електроніка", fileUrl: "audio/track4.mp3" },
            { title: "Gym Class Heroes – Cupid's Chokehold", genre: "Поп-реп / Хіп-хоп", fileUrl: "audio/track5.mp3" },
            { title: "Tame Impala – The Less I Know The Better", genre: "Інді-рок / Психоделіка", fileUrl: "audio/track6.mp3" },
            { title: "Queen – Another One Bites the Dust", genre: "Класичний Рок", fileUrl: "audio/track7.mp3" },
            { title: "The Weeknd – Blinding Lights", genre: "Сінті-поп / R&B", fileUrl: "audio/track8.mp3" }
        ];

        let gameState = {
            player1: "Гравець 1",
            player2: "Гравець 2",
            score1: 0,
            score2: 0,
            currentRound: 1,
            maxRounds: 8,
            activePlayer: 1,
            currentTrack: null,
            audio: null,
            isAnswered: false
        };

        let snippetTimer = null;

        const lobbyScreen = document.getElementById("lobby-screen");
        const gameScreen = document.getElementById("game-screen");
        const endScreen = document.getElementById("end-screen");
        const startBtn = document.getElementById("start-btn");
        const playBtn = document.getElementById("play-btn");

        const p1NameDisplay = document.getElementById("p1-name-display");
        const p2NameDisplay = document.getElementById("p2-name-display");
        const p1Score = document.getElementById("p1-score");
        const p2Score = document.getElementById("p2-score");
        const p1Card = document.getElementById("p1-card");
        const p2Card = document.getElementById("p2-card");
        const currentRoundEl = document.getElementById("current-round");
        const turnAnnouncement = document.getElementById("turn-announcement");
        const choicesContainer = document.getElementById("choices-container");
        const trackReveal = document.getElementById("track-reveal");
        const revealTitle = document.getElementById("reveal-title");
        const winnerAnnouncement = document.getElementById("winner-announcement");
        const finalScoresText = document.getElementById("final-scores-text");

        startBtn.addEventListener("click", () => {
            const p1Val = document.getElementById("player1-input").value.trim();
            const p2Val = document.getElementById("player2-input").value.trim();

            if (p1Val) gameState.player1 = p1Val;
            if (p2Val) gameState.player2 = p2Val;

            p1NameDisplay.textContent = gameState.player1;
            p2NameDisplay.textContent = gameState.player2;

            lobbyScreen.classList.remove("active");
            gameScreen.classList.add("active");

            startRound();
        });

        function startRound() {
            gameState.isAnswered = false;
            trackReveal.style.display = "none";
            currentRoundEl.textContent = gameState.currentRound;
            playBtn.textContent = "▶ Відтворити уривок";
            clearTimeout(snippetTimer);

            if (gameState.activePlayer === 1) {
                p1Card.classList.add("active-turn");
                p2Card.classList.remove("active-turn");
                turnAnnouncement.textContent = `Хід гравця: ${gameState.player1}`;
            } else {
                p2Card.classList.add("active-turn");
                p1Card.classList.remove("active-turn");
                turnAnnouncement.textContent = `Хід гравця: ${gameState.player2}`;
            }

            const trackIndex = (gameState.currentRound - 1) % tracksData.length;
            gameState.currentTrack = tracksData[trackIndex];

            if (gameState.audio) {
                gameState.audio.pause();
            }
            gameState.audio = new Audio(gameState.currentTrack.fileUrl);
            gameState.audio.load();

            generateChoices(gameState.currentTrack);
        }

        playBtn.addEventListener("click", () => {
            if (gameState.audio) {
                if (gameState.audio.paused) {
                    gameState.audio.currentTime = 0;
                    gameState.audio.play().then(() => {
                        playBtn.textContent = "⏸ Пауза";
                        
                        clearTimeout(snippetTimer);
                        snippetTimer = setTimeout(() => {
                            if (gameState.audio && !gameState.audio.paused) {
                                gameState.audio.pause();
                                playBtn.textContent = "▶ Відтворити уривок";
                            }
                        }, 6000);

                    }).catch(e => {
                        console.log("Помилка відтворення:", e);
                    });
                } else {
                    gameState.audio.pause();
                    clearTimeout(snippetTimer);
                    playBtn.textContent = "▶ Продовжити";
                }
            }
        });

        function generateChoices(correctTrack) {
            choicesContainer.innerHTML = "";

            let allGenres = [...new Set(tracksData.map(t => t.genre))];
            let wrongGenres = allGenres.filter(g => g !== correctTrack.genre);
            shuffleArray(wrongGenres);
            
            let options = [
                { text: correctTrack.genre, correct: true },
                { text: wrongGenres[0], correct: false },
                { text: wrongGenres[1], correct: false }
            ];
            shuffleArray(options);

            const letters = ['A', 'B', 'C'];
            options.forEach((opt, index) => {
                const card = document.createElement("div");
                card.className = "choice-card";
                card.innerHTML = `
                    <div class="choice-letter">${letters[index]}</div>
                    <div class="choice-text">${opt.text}</div>
                `;
                card.addEventListener("click", () => handleAnswer(opt.correct, card));
                choicesContainer.appendChild(card);
            });
        }

        function handleAnswer(isCorrect, cardElement) {
            if (gameState.isAnswered) return;
            gameState.isAnswered = true;

            if (gameState.audio) {
                gameState.audio.pause();
                clearTimeout(snippetTimer);
                playBtn.textContent = "▶ Відтворити уривок";
            }

            const cards = choicesContainer.querySelectorAll(".choice-card");
            cards.forEach(c => {
                const text = c.querySelector(".choice-text").textContent;
                if (text === gameState.currentTrack.genre) {
                    c.classList.add("correct");
                } else if (c === cardElement && !isCorrect) {
                    c.classList.add("wrong");
                }
            });

            if (isCorrect) {
                if (gameState.activePlayer === 1) {
                    gameState.score1 += 100;
                    p1Score.textContent = gameState.score1;
                } else {
                    gameState.score2 += 100;
                    p2Score.textContent = gameState.score2;
                }
            }

            revealTitle.innerHTML = `🎵 Трек: "${gameState.currentTrack.title}"<br>Жанр: <span style="color: #00ffcc;">${gameState.currentTrack.genre}</span>`;
            trackReveal.style.display = "block";

            setTimeout(() => {
                gameState.currentRound++;
                gameState.activePlayer = gameState.activePlayer === 1 ? 2 : 1;

                if (gameState.currentRound > gameState.maxRounds) {
                    endGame();
                } else {
                    startRound();
                }
            }, 3500);
        }

        function endGame() {
            gameScreen.classList.remove("active");
            endScreen.classList.add("active");

            let winnerText = "";
            if (gameState.score1 > gameState.score2) {
                winnerText = `🏆 Переможець: ${gameState.player1}!`;
            } else if (gameState.score2 > gameState.score1) {
                winnerText = `🏆 Переможець: ${gameState.player2}!`;
            } else {
                winnerText = `🤝 Нічия! Чудовий результат!`;
            }

            winnerAnnouncement.textContent = winnerText;
            finalScoresText.textContent = `${gameState.player1}: ${gameState.score1} очок | ${gameState.player2}: ${gameState.score2} очок`;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    </script>
</body>
</html>
